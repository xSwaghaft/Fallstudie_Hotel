# Database Configuration
# Override with SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD in Docker
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://127.0.0.1:3306/hotelbooking}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:hotel}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:hotelpass}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA Configuration
# WARNING: create-drop deletes ALL data on every restart - only for Development!
# In Production, validate or none should be used
# Override with SPRING_JPA_HIBERNATE_DDL_AUTO in Docker (e.g. "validate" or "none")
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:create-drop}
# show-sql should be false in Production (Performance)
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# Vaadin Configuration
# Allow overriding production mode from environment (Docker/JVM). If the
# environment variable `VAADIN_PRODUCTION_MODE` is set to `true`, this will
# enable Vaadin production mode at runtime. Defaults to false for local dev.
vaadin.productionMode=${VAADIN_PRODUCTION_MODE:false}

# SQL Init for test data
# With create-drop: DB is recreated on every restart, so 'always' is safe
# With update/validate: 'always' works because INSERT IGNORE + UNIQUE constraints prevent duplicates
# Alternative: set to 'never' in production if you don't want test data
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
# Defer running data.sql until after Hibernate has created tables
spring.jpa.defer-datasource-initialization=true

# Demo users for development (set to true to enable creating demo users at startup)
# app.demo-users.enabled=false

# --- Mail (SMTP) configuration
# Override with SPRING_MAIL_HOST, SPRING_MAIL_PORT in Docker
# Default: localhost:1025 (Mailpit/MailHog for Development)
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.protocol=smtp
# MailHog/Mailpit does not require auth (adjust for real SMTP servers)
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS_ENABLE:false}
# For production SMTP servers: configure username and password via environment variables
# spring.mail.username=${SPRING_MAIL_USERNAME:}
# spring.mail.password=${SPRING_MAIL_PASSWORD:}
# spring.mail.properties.mail.smtp.ssl.enable=${SPRING_MAIL_SMTP_SSL_ENABLE:false}
# Default from address used by the EmailService
app.mail.from=${APP_MAIL_FROM:dev@local.test}

# To enable real sending during development, adjust these values for your SMTP provider and restart the application.

# DevTools
# Uploads into src/main/resources/static/** would otherwise trigger DevTools restarts and a browser reload.
# Exclude uploaded images so the ImageManagement edit dialog doesn't get interrupted.
spring.devtools.restart.exclude=static/images/**
spring.devtools.livereload.enabled=false

# Image upload/storage
# Files are stored on the filesystem (not in the classpath). In Docker, mount this directory as a volume.
# URL mapping is handled by StaticResourceConfig: /images/** -> file:${app.images.root-dir}
app.images.root-dir=${APP_IMAGES_ROOT_DIR:data/images}

# Demo image seeding
# Copies classpath demo images from src/main/resources/static/images/rooms into ${app.images.root-dir}/rooms
# on first startup and writes a marker file so deletions won't be undone on restart.
app.images.seed.enabled=${APP_IMAGES_SEED_ENABLED:true}
app.images.seed.marker-file=${APP_IMAGES_SEED_MARKER_FILE:.seeded-demo-images}


